# 打插件包并发布。
#
# 运行时底包不进 git，事先放到本仓库 tag=runtime 的 Release：
#   macOS:   node scripts/build.mjs --seed --upload
#   Windows: powershell -File scripts\seed.ps1   （再 gh release upload runtime …）
#
# 触发：打 tag v* / doc-runtime-v*，或手动 Run workflow。

name: release

on:
  push:
    tags:
      - 'v*'
      - 'doc-runtime-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: windows-2022
            platform: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 下载运行时底包
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download runtime --repo "${{ github.repository }}" --pattern "runtime-${{ matrix.platform }}.tar.zst" --dir dist

      - name: 打包（macOS）
        if: runner.os == 'macOS'
        run: node scripts/build.mjs --runtime "dist/runtime-${{ matrix.platform }}.tar.zst"

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: pwsh -File scripts/build.ps1 -Runtime "dist/runtime-${{ matrix.platform }}.tar.zst"

      # 冒烟的是打出来的 .tar.zst 本身，不是铺出目录 —— 0.2.0 坏在打包那一步
      # （符号链接被改写成构建机的绝对路径），只验铺出目录看不出来。
      # macOS 失败就中止发布；publish 依赖这个 job。
      - name: 冒烟（macOS）
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          out=$(ls dist/${{ matrix.platform }}/*.tar.zst)
          rm -rf "$RUNNER_TEMP/verify" && mkdir -p "$RUNNER_TEMP/verify"
          node scripts/zstd.mjs -d "$out" "$RUNNER_TEMP/pack.tar"
          tar -xf "$RUNNER_TEMP/pack.tar" -C "$RUNNER_TEMP/verify" --strip-components 1
          node scripts/verify.mjs "$RUNNER_TEMP/verify"

      # Windows 的冒烟先不拦发布：verify.mjs 在 windows-2022 runner 上还没跑过，
      # LibreOffice 首次启动和 Git bash shim 都可能因为 runner 环境而不是包本身
      # 出错。跑稳几次之后把 continue-on-error 去掉。
      - name: 冒烟（Windows）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Get-ChildItem "dist/${{ matrix.platform }}/*.tar.zst" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'verify'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          node scripts/zstd.mjs -d $out.FullName (Join-Path $env:RUNNER_TEMP 'pack.tar')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          tar.exe -xf (Join-Path $env:RUNNER_TEMP 'pack.tar') -C $dir --strip-components 1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/verify.mjs $dir

      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 读版本
        id: ver
        run: |
          v=$(node -p "require('./plugin.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=doc-runtime-v$v" >> "$GITHUB_OUTPUT"

      - name: 上传 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          files=(artifacts/pack-*/*.tar.zst)
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --notes "Riot 插件 $tag"
          fi
          gh release upload "$tag" "${files[@]}" --repo "${{ github.repository }}" --clobber

      - name: 更新官方目录
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$MARKETPLACE_TOKEN" ]; then
            echo "未配置 MARKETPLACE_TOKEN，跳过更新 riot-marketplace。Release 已上传。"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${MARKETPLACE_TOKEN}@github.com/riot-org/riot-marketplace.git" marketplace
          node scripts/publish-market.mjs --catalog marketplace/marketplace.json artifacts/pack-*/marketplace.json
          cd marketplace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace.json
          git diff --cached --quiet && exit 0
          git commit -m "发布 ${{ steps.ver.outputs.tag }}"
          git push
